entrypoint:
  - bash ${TACC_WORKDIR}/sdk-test.sh
environment:
  name: comp4611-pa2-v1
  channels:
    - nodefaults
  dependencies:
    - "{}"
job:
  name: pa2-sdk
  general:
    - partition=tacc
    - nodes=1
    - ntasks=1
    - cpus-per-task=2
    - gres=gpu:1
    - time=00:05:00
    - output=${TACC_SLURM_USERLOG}/pa2-sdk-%j.log
