# =============================================================================
# dots.conf — declarative description of what `dots` synchronizes
# Sourced by ~/.local/bin/dots. Bash syntax, keep it POSIX-ish and quoting sane.
# =============================================================================

# Git remote used by `dots bootstrap` / first push.
DOTS_REMOTE="${DOTS_REMOTE:-git@github.com:XinlinProtoWu/dotfiles.git}"

# Anything above this size (MB) is treated as a binary artefact and kept out of
# git (the file stays on disk, it is just not tracked).
MAX_FILE_MB="${MAX_FILE_MB:-2}"

# -----------------------------------------------------------------------------
# Plain dotfiles at the root of $HOME
# -----------------------------------------------------------------------------
HOME_FILES=(
  .bashrc
  .bash_profile
  .profile
  .gitconfig
  .gitignore_global
  .inputrc
  .Xresources
  .abcde.conf
  .viminfo
)

# -----------------------------------------------------------------------------
# ~/.config — everything is mirrored except these rsync patterns.
# Patterns are relative to ~/.config; trailing / means directory.
# -----------------------------------------------------------------------------
CONFIG_EXCLUDES=(
  # --- heavyweight application caches (rebuildable, hundreds of MB) ---
  'discord/' 'vesktop/' 'QQ/' 'google-chrome/' 'google-chrome-headless/' 'chromium/'
  'BraveSoftware/' 'Code/' 'Electron/' 'slack/' 'spotify/' 'endcord/' 'obsidian/'
  'VirtualBox/' 'gvfs-metadata/' 'simple-update-notifier/' 'pupgui/'
  '*Cache*/' '*cache*/'
  # --- credentials / machine identity ---
  'pulse/' 'Moonlight Game Streaming Project/'
  'io.github.clash-verge-rev.clash-verge-rev/' 'clash-verge/' '*.cookie' 'cookie'
  '*.key' '*.pem' 'id_*' '*.age' '*.gpg'
  # --- runtime state, not configuration ---
  'mpd/log' 'mpd/database' 'mpd/state' 'mpd/pid' 'mpd/playlists/*.m3u'
  '*.log' '*.wal' '*.lock' '*.pid' '*.swp' '*.tmp' '*~'
  # churn: regenerated on every boot/run, not configuration
  'dconf/' 'go/telemetry/' 'fcitx5/conf/cached_layouts' 'flutter/tool_state'
  'calibre/dynamic.pickle.json' 'qBittorrent/session/*'
  'workspace.json' 'workspace-mobile.json' '*workspace-mobile.json'
  '.git/' 'node_modules/' '__pycache__/'
)

# Machine-specific files: never synced into the shared tree, saved to
# profiles/<hostname>/overlay/ instead (see HOST_OVERLAY_FILES below).
HOST_OVERLAY_FILES=(
  .config/hypr/machine.lua
)

# -----------------------------------------------------------------------------
# Pi (agent) workflows — agent dir is ~/.pi/agent, skills live in ~/.agents/skills
# -----------------------------------------------------------------------------
PI_FILES=(
  settings.json
  keybindings.json
  mcp.json
  models.json
  AGENTS.md
  AGENTS.override.md
  SYSTEM.md
  APPEND_SYSTEM.md
)
PI_DIRS=(
  extensions
  skills
  prompts
  themes
)
# auth.json is deliberately absent: it holds API keys. Use `dots secrets`.

# -----------------------------------------------------------------------------
# Obsidian vaults: every .obsidian directory below these roots is versioned.
# Notes themselves are NOT copied — only the vault configuration + plugins.
# -----------------------------------------------------------------------------
VAULT_ROOTS=(
  "$HOME/learn"
  "$HOME/documents"
  "$HOME/notes"
)
VAULT_EXCLUDES=(
  'workspace.json'
  'workspace-mobile.json'
  'cache/'
  'node_modules/'
  '.trash/'
  '*.log'
)

# -----------------------------------------------------------------------------
# System configuration copied to /etc (restored only with `dots pull --system`)
# -----------------------------------------------------------------------------
ETC_FILES=(
  /etc/default/grub
  /etc/mkinitcpio.conf
  /etc/modprobe.d/
  /etc/pacman.conf
  /etc/systemd/logind.conf
  /etc/tlp.conf
  /etc/profile.d/pspdev.sh
)

# -----------------------------------------------------------------------------
# Tools installed outside pacman/pipx/npm, recorded in manifests/external.txt
# and reinstalled by `dots pull` when the check command fails.
# Format: "name|check command|install command"
# -----------------------------------------------------------------------------
EXTERNALS=(
  "pi|command -v pi|curl -fsSL https://pi.dev/install.sh | sh"
  "oh-my-posh|command -v omp|curl -s https://ohmyposh.dev/install.sh | bash -s -- -d \$HOME/.local/bin"
  "devkitpro|test -d /opt/devkitpro|sudo pacman -U --noconfirm https://pkg.devkitpro.org/devkitpro-keyring.pkg.tar.zst && sudo pacman-key --populate devkitpro"
  "pspdev|test -x /usr/local/pspdev/bin/psp-gcc|echo 'Install PSPDEV from https://github.com/pspdev/pspdev then re-run: dots pull'"
)

# -----------------------------------------------------------------------------
# Secret files handled by `dots secrets` (age/gpg encrypted bundle, opt-in).
# Paths are relative to $HOME. Never committed in plaintext.
# -----------------------------------------------------------------------------
SECRET_FILES=(
  .pi/agent/auth.json
  .config/pulse/cookie
  ".config/Moonlight Game Streaming Project/Moonlight.conf"
  .config/hypr/machine.env
)

# -----------------------------------------------------------------------------
# Hooks — executable scripts run by `dots` (optional). Dotfile override hooks
# must be executable. Per-host hooks live in profiles/<hostname>/.
# -----------------------------------------------------------------------------
HOOKS_DIR="${DOTS_REPO:-$HOME/.dotfiles}/hooks"
