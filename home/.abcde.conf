# ~/.abcde.conf - overrides /etc/abcde.conf (which is root-owned)

CDROM=/dev/sr0
CDROMREADERSYNTAX=libcdio

# freedb.org shut down in 2020; gnudb.org is the live CDDB successor.
# (abcde's built-in default points at the dead freedb URL -> "No lookup matches")
CDDBMETHOD=cddb
CDDBURL="http://gnudb.gnudb.org/~cddb/cddb.cgi"

OUTPUTTYPE=flac
OUTPUTDIR="$HOME/music"
ACTIONS=cddb,read,encode,tag,move,clean
